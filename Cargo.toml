[package]
name = "SmartSnip"
version = "1.0.0"
edition = "2021"
description = "轻量级 Windows 常驻截图工具"
authors = ["Winfxk (冰月) <admin@winfxk.cn>"]
license = "MIT"

[[bin]]
name = "SmartSnip"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Media_Ocr",
    "Globalization",
    "Foundation_Collections",
    "Storage_Streams",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
] }
arboard = "3"
rqrr = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[build-dependencies]
win-resource-builder = "0.2"
